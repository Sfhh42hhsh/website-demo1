<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludgecrone</title>

  <!-- Clean modern font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      color: white;
      overflow: hidden;

      /* CENTER THE GIRL */
      background: url("a33.png") no-repeat center 65% fixed;
      background-size: cover;
    }

    /* DARK FADE (lighter than before so we SEE the girl) */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center,
        rgba(0,0,0,0.1) 0%,
        rgba(0,0,0,0.5) 70%,
        rgba(0,0,0,0.85) 100%);
      z-index: 0;
    }

    /* SUBTLE MOTION */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.03), transparent 60%);
      animation: moveBg 30s linear infinite;
      z-index: 0;
    }

    @keyframes moveBg {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-10%, -10%); }
      100% { transform: translate(0, 0); }
    }

    /* GITHUB-STYLE CARD */
    .card {
      position: relative;
      text-align: center;
      padding: 28px;
      border-radius: 12px;

      background: rgba(13,17,23,0.75); /* GitHub dark */
      backdrop-filter: blur(12px);

      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);

      width: 240px;
      z-index: 1;

      transition: transform 0.25s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    /* TITLE (smooth + animated) */
    h1 {
      margin: 10px 0;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;

      background: linear-gradient(90deg, #fff, #bbb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: fadeSlide 1.2s ease;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* BUTTON (github-like) */
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 16px;
      border-radius: 6px;

      background: #21262d;
      color: #c9d1d9;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;

      border: 1px solid rgba(255,255,255,0.1);

      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #30363d;
      border-color: rgba(255,255,255,0.2);
    }

  </style>
</head>

<body>

  <div class="card">
    <h1>Ludgecrone</h1>

    <a class="btn" href="https://discord.com/users/260466241309900811" target="_blank">
      Contact
    </a>
  </div>

</body>
</html>
