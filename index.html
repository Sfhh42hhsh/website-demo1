<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludgecrone</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;

      /* YOUR CUSTOM BACKGROUND */
      background: url("a33.png") no-repeat center center fixed;
      background-size: cover;

      color: white;
    }

    .card {
      text-align: center;
      padding: 30px;
      border-radius: 20px;

      /* Glass effect */
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.1);

      width: 280px;
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.6);
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    p {
      margin-top: 5px;
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
    }

    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      border-radius: 10px;

      background: rgba(255,255,255,0.15);
      color: white;

      text-decoration: none;
      font-weight: bold;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- PROFILE IMAGE (unchanged) -->
    <img src="a411aa.png" alt="Profile Image">

    <h1>Ludgecrone</h1>

    <p>Click below to contact</p>

    <a class="btn" href="https://discord.com/users/260466241309900811" target="_blank">
      My only discord
    </a>

  </div>

</body>
</html>
