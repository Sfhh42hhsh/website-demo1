<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludgecrone</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;

      /* FIXED BACKGROUND */
      background: url("a33.png") no-repeat center center;
      background-size: contain;
      background-color: #000;
    }

    /* Soft overlay so edges look intentional */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }

    /* Subtle animated light */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 60%);
      animation: moveBg 20s linear infinite;
      z-index: 0;
    }

    @keyframes moveBg {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-25%, -25%); }
      100% { transform: translate(0, 0); }
    }

    .card {
      position: relative;
      text-align: center;
      padding: 35px;
      border-radius: 18px;

      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);

      width: 260px;
      z-index: 1;

      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    h1 {
      margin: 10px 0;
      font-size: 1.9rem;
      letter-spacing: 1px;
      font-weight: 600;
      text-shadow: 0 0 12px rgba(255,255,255,0.2);
    }

    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      border-radius: 10px;

      background: rgba(255,255,255,0.12);
      color: white;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;

      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      background: rgba(255,255,255,0.25);
      box-shadow: 0 0 15px rgba(255,255,255,0.25);
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Ludgecrone</h1>

    <a class="btn" href="https://discord.com/users/260466241309900811" target="_blank">
      Contact
    </a>
  </div>

</body>
</html>
