<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludgecrone</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      color: white;
      overflow: hidden;

      background: url("download (2).jpg") no-repeat center center fixed;
      background-size: cover;
    }

    /* SOFT DARK OVERLAY */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.3),
        rgba(0,0,0,0.6)
      );
      z-index: 0;
    }

    /* SUBTLE FLOATING LIGHT */
    body::before {
      content: "";
      position: absolute;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 60%);
      animation: floatBg 25s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes floatBg {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-5%, -5%); }
      100% { transform: translate(0, 0); }
    }

    /* MAIN CARD */
    .card {
      position: relative;
      z-index: 1;

      width: 340px;
      padding: 45px 35px;

      border-radius: 18px;

      background: rgba(25, 25, 30, 0.5);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 15px 50px rgba(0,0,0,0.6);

      text-align: center;

      animation: fadeUp 1s ease;
    }

    /* SOFT FLOAT EFFECT */
    .card:hover {
      transform: translateY(-6px);
      transition: 0.3s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* TITLE */
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.5px;

      background: linear-gradient(90deg, #ffffff, #cfcfcf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: glowFade 2s ease;
    }

    @keyframes glowFade {
      from {
        opacity: 0;
        filter: blur(6px);
      }
      to {
        opacity: 1;
        filter: blur(0);
      }
    }

    /* BUTTON */
    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      border-radius: 8px;

      background: rgba(255,255,255,0.08);
      color: #e6edf3;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;

      border: 1px solid rgba(255,255,255,0.12);

      backdrop-filter: blur(10px);

      transition: all 0.25s ease;
    }

    .btn:hover {
      background: rgba(255,255,255,0.18);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,255,255,0.15);
    }

  </style>
</head>

<body>

  <div class="card">
    <h1>Ludgecrone</h1>

    <a class="btn" href="https://discord.com/users/260466241309900811" target="_blank">
      Contact
    </a>
  </div>

</body>
</html>
